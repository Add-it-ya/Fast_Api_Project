name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint, types, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (format)
        run: ruff format --check .

      - name: mypy
        run: mypy app

      - name: bandit
        run: bandit -q -c pyproject.toml -r app

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carprice
          POSTGRES_PASSWORD: carprice
          POSTGRES_DB: carprice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carprice"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://carprice:carprice@localhost:5432/carprice
      REDIS_URL: redis://localhost:6379
      API_KEY: ci-api-key-value
      JWT_SECRET_KEY: ci-jwt-secret-key-of-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t car-price-api .

      - name: Migrations and app import cleanly
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql+asyncpg://u:p@localhost:5432/db \
            -e REDIS_URL=redis://localhost:6379 \
            -e API_KEY=ci-api-key-value \
            -e JWT_SECRET_KEY=ci-jwt-secret-key-of-at-least-32-characters \
            car-price-api python -c "import app.main; print('app imports cleanly')"
