services:
  api:
    build: .
    container_name: fastapi-app
    ports:
      - "8000:8000"
    environment:
      - API_KEY=local-dev-api-key
      - JWT_SECRET_KEY=local-development-only-secret-key-not-for-production
      - DATABASE_URL=postgresql+asyncpg://carprice:carprice@postgres:5432/carprice
      - REDIS_URL=redis://redis:6379
      # Raised well above the production default (60/min) so the bundled load
      # test measures the prediction path rather than the rate limiter.
      - RATE_LIMIT_REQUESTS=1000000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: postgres1
    environment:
      - POSTGRES_USER=carprice
      - POSTGRES_PASSWORD=carprice
      - POSTGRES_DB=carprice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carprice -d carprice"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:alpine
    container_name: redis1
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana1
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
